# Publishes a GitHub release when the version in package.json changes on main: tag v<version> on
# that commit, with GitHub's generated notes (the PRs merged since the last release). A version
# that already has a release is left alone. It also runs when this file changes, so a version
# bumped before it existed (or while it was broken) gets its release then.
name: Release

on:
  push:
    branches: [main]
    paths: [package.json, .github/workflows/release.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release the new version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "$tag is already released"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
